name: Generate MCQ Options

on:
  # generate-explanations.yml-এর মতোই — auto-schedule বন্ধ রাখা হলো যাতে RTDB
  # no-cost limit শেষ না হয়ে যায়। দরকার হলে Actions ট্যাব থেকে ম্যানুয়ালি চালাও,
  # ফিল্টার বসিয়েও চালানো যাবে। ভবিষ্যতে schedule চালু করতে চাইলে নিচের দুই লাইন
  # uncomment করো।
  # schedule:
  #   - cron: "0 */3 * * *"
  workflow_dispatch: # GitHub-এর Actions ট্যাব থেকে "Run workflow" চেপে ম্যানুয়ালি চালানো যাবে
    inputs:
      filter_audience:
        description: "Audience Tag(s), কমা দিয়ে একাধিক দেওয়া যায় (খালি রাখলে সব)"
        required: false
        default: ""
      filter_subject:
        description: "Subject(s), কমা দিয়ে একাধিক দেওয়া যায় (খালি রাখলে সব)"
        required: false
        default: ""
      filter_subtopic:
        description: "Sub-topic(s), কমা দিয়ে একাধিক দেওয়া যায় (খালি রাখলে সব)"
        required: false
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # সর্বোচ্চ ৬ ঘন্টার একটু কম, নিরাপদ বাফার রেখে

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run MCQ option generator
        env:
          GAS_URL: ${{ secrets.VITE_GAS_URL }}
          GAS_SECRET: ${{ secrets.GAS_SECRET }}
          SHEETS: "Quiz,QBank"
          GROQ_KEYS: ${{ secrets.GROQ_KEYS }}
          MISTRAL_KEYS: ${{ secrets.MISTRAL_KEYS }}
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
          OPENROUTER_KEYS: ${{ secrets.OPENROUTER_KEYS }}
          CEREBRAS_KEYS: ${{ secrets.CEREBRAS_KEYS }}
          TOGETHER_KEYS: ${{ secrets.TOGETHER_KEYS }}
          FIREWORKS_KEYS: ${{ secrets.FIREWORKS_KEYS }}
          DEEPSEEK_KEYS: ${{ secrets.DEEPSEEK_KEYS }}
          DELAY_MS: "1200"
          MAX_RUNTIME_MIN: "330"
          FILTER_AUDIENCE: ${{ github.event.inputs.filter_audience }}
          FILTER_SUBJECT: ${{ github.event.inputs.filter_subject }}
          FILTER_SUBTOPIC: ${{ github.event.inputs.filter_subtopic }}
        run: node scripts/generate-mcq-options.mjs
