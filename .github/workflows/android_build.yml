name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Web Build
        run: npm run build

      - name: Initialize Capacitor
        run: npx cap init "SmartAdmin" "com.smartstudy.admin" --web-dir dist

      - name: Add Android Platform
        run: npx cap add android && npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # এখানে Base64 থেকে Keystore ফাইলটি তৈরি করা হচ্ছে
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      # রিলিজ বিল্ড এবং সাইন করার ধাপ
      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="hanif-alias" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      # সাইন করা রিলিজ APK আপলোড
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAdmin-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
