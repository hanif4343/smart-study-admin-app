name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm install

      - name: Web Build
        env:
          VITE_FB_API_KEY:      ${{ secrets.VITE_FB_API_KEY }}
          VITE_FB_AUTH_DOMAIN:  ${{ secrets.VITE_FB_AUTH_DOMAIN }}
          VITE_FB_DATABASE_URL: ${{ secrets.VITE_FB_DATABASE_URL }}
          VITE_FB_PROJECT_ID:   ${{ secrets.VITE_FB_PROJECT_ID }}
          VITE_GAS_URL:         ${{ secrets.VITE_GAS_URL }}
          VITE_IMGBB_API_KEY:   ${{ secrets.VITE_IMGBB_API_KEY }}
          VITE_SECRET_KEY:      ${{ secrets.VITE_SECRET_KEY }}
          VITE_FB_DB_SECRET:    ${{ secrets.VITE_FB_DB_SECRET }}
        run: npm run build

      - name: Initialize Capacitor
        run: |
          npx cap init "SmartAdmin" "com.smartstudy.admin" --web-dir dist
          # cap init overwrites capacitor.config.json — restore server block
          printf '{\n  "appId": "com.smartstudy.admin",\n  "appName": "Smart Admin",\n  "webDir": "dist",\n  "server": {\n    "hostname": "localhost",\n    "androidScheme": "https"\n  }\n}\n' > capacitor.config.json

      - name: Add Android Platform
        run: npx cap add android && npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Build Android Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: hanif-alias
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAdmin-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
