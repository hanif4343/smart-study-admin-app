name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm install

      - name: Web Build
        env:
          VITE_FB_API_KEY:      ${{ secrets.VITE_FB_API_KEY }}
          VITE_FB_AUTH_DOMAIN:  ${{ secrets.VITE_FB_AUTH_DOMAIN }}
          VITE_FB_DATABASE_URL: ${{ secrets.VITE_FB_DATABASE_URL }}
          VITE_FB_PROJECT_ID:   ${{ secrets.VITE_FB_PROJECT_ID }}
          VITE_GAS_URL:         ${{ secrets.VITE_GAS_URL }}
          VITE_IMGBB_API_KEY:   ${{ secrets.VITE_IMGBB_API_KEY }}
          VITE_SECRET_KEY:      ${{ secrets.VITE_SECRET_KEY }}
          VITE_FB_DB_SECRET:    ${{ secrets.VITE_FB_DB_SECRET }}
        run: npm run build

      - name: Initialize Capacitor
        run: |
          npx cap init "SmartAdmin" "com.smartstudy.admin" --web-dir dist
          printf '{"appId":"com.smartstudy.admin","appName":"Smart Admin","webDir":"dist","server":{"hostname":"localhost","androidScheme":"https"}}\n' > capacitor.config.json

      - name: Add Android Platform & Sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Inject MLKit OCR Plugin + Permissions
        # IMPORTANT: No cap sync after this step — it would overwrite MainActivity.kt
        run: |
          PKG_DIR="android/app/src/main/java/com/smartstudy/admin"
          mkdir -p "$PKG_DIR"
          cp android-src/OcrPlugin.kt   "$PKG_DIR/OcrPlugin.kt"
          cp android-src/MainActivity.kt "$PKG_DIR/MainActivity.kt"
          python3 android-src/add_mlkit.py

      - name: Verify Plugin Injection
        run: |
          PKG_DIR="android/app/src/main/java/com/smartstudy/admin"
          echo "=== Package directory ==="
          ls -la "$PKG_DIR/"
          echo ""
          echo "=== MainActivity.kt ==="
          cat "$PKG_DIR/MainActivity.kt"
          echo ""
          echo "=== build.gradle MLKit check ==="
          grep -i "mlkit\|text-recognition" android/app/build.gradle || echo "WARNING: MLKit not found in build.gradle!"
          echo ""
          echo "=== AndroidManifest permissions ==="
          grep "READ_MEDIA\|CAMERA\|READ_EXTERNAL" android/app/src/main/AndroidManifest.xml || echo "WARNING: permissions not found!"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Build Android Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: hanif-alias
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAdmin-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
