name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm install

      - name: Web Build
        env:
          VITE_FB_API_KEY:      ${{ secrets.VITE_FB_API_KEY }}
          VITE_FB_AUTH_DOMAIN:  ${{ secrets.VITE_FB_AUTH_DOMAIN }}
          VITE_FB_DATABASE_URL: ${{ secrets.VITE_FB_DATABASE_URL }}
          VITE_FB_PROJECT_ID:   ${{ secrets.VITE_FB_PROJECT_ID }}
          VITE_GAS_URL:         ${{ secrets.VITE_GAS_URL }}
          VITE_IMGBB_API_KEY:   ${{ secrets.VITE_IMGBB_API_KEY }}
          VITE_SECRET_KEY:      ${{ secrets.VITE_SECRET_KEY }}
          VITE_FB_DB_SECRET:    ${{ secrets.VITE_FB_DB_SECRET }}
        run: npm run build

      - name: Initialize Capacitor
        run: |
          npx cap init "SmartAdmin" "com.smartstudy.admin" --web-dir dist
          # cap init overwrites capacitor.config.json — restore server block
          printf '{\n  "appId": "com.smartstudy.admin",\n  "appName": "Smart Admin",\n  "webDir": "dist",\n  "server": {\n    "hostname": "localhost",\n    "androidScheme": "https"\n  }\n}\n' > capacitor.config.json

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Inject MLKit OCR Plugin
        run: |
          PKG="com/smartstudy/admin"
          DIR="android/app/src/main/java/${PKG}"
          mkdir -p "$DIR"

          # ── OcrPlugin.kt ──────────────────────────────────────────────
          cat > "$DIR/OcrPlugin.kt" << 'KOTLIN'
package com.smartstudy.admin

import android.graphics.Bitmap
import android.graphics.BitmapFactory
import android.graphics.Canvas
import android.graphics.ColorMatrix
import android.graphics.ColorMatrixColorFilter
import android.graphics.Paint
import android.util.Base64
import com.getcapacitor.JSObject
import com.getcapacitor.Plugin
import com.getcapacitor.PluginCall
import com.getcapacitor.PluginMethod
import com.getcapacitor.annotation.CapacitorPlugin
import com.google.mlkit.vision.common.InputImage
import com.google.mlkit.vision.text.TextRecognition
import com.google.mlkit.vision.text.latin.TextRecognizerOptions
import com.google.mlkit.vision.text.devanagari.DevanagariTextRecognizerOptions

@CapacitorPlugin(name = "OcrPlugin")
class OcrPlugin : Plugin() {

    @PluginMethod
    fun recognizeText(call: PluginCall) {
        val b64 = call.getString("base64") ?: run { call.reject("base64 required"); return }
        val bytes = try { Base64.decode(b64, Base64.DEFAULT) } catch (e: Exception) { call.reject("base64 decode error: ${e.message}"); return }
        val bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.size) ?: run { call.reject("bitmap decode failed"); return }
        val sized = ensureMinSize(bmp)
        val enhanced = enhance(sized)
        var best = ""
        var pending = 2
        val lock = Object()
        fun done(txt: String) {
            synchronized(lock) {
                if (txt.length > best.length) best = txt
                pending--
                if (pending == 0) {
                    if (sized !== bmp) sized.recycle()
                    enhanced.recycle()
                    val ret = JSObject(); ret.put("text", best)
                    call.resolve(ret)
                }
            }
        }
        TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
            .process(InputImage.fromBitmap(enhanced, 0))
            .addOnSuccessListener { r -> done(r.textBlocks.flatMap { it.lines }.joinToString("\n") { it.text }) }
            .addOnFailureListener { done("") }
        TextRecognition.getClient(DevanagariTextRecognizerOptions.Builder().build())
            .process(InputImage.fromBitmap(enhanced, 0))
            .addOnSuccessListener { r -> done(r.textBlocks.flatMap { it.lines }.joinToString("\n") { it.text }) }
            .addOnFailureListener { done("") }
    }

    private fun ensureMinSize(bmp: Bitmap): Bitmap {
        val min = 1080; val s = minOf(bmp.width, bmp.height)
        if (s >= min) return bmp
        val sc = min.toFloat() / s
        return Bitmap.createScaledBitmap(bmp, (bmp.width*sc).toInt(), (bmp.height*sc).toInt(), true)
    }

    private fun enhance(src: Bitmap): Bitmap {
        val out = Bitmap.createBitmap(src.width, src.height, Bitmap.Config.ARGB_8888)
        val p = Paint(Paint.ANTI_ALIAS_FLAG)
        val cm = ColorMatrix().apply { setSaturation(0f) }
        cm.postConcat(ColorMatrix(floatArrayOf(1.8f,0f,0f,0f,-60f,0f,1.8f,0f,0f,-60f,0f,0f,1.8f,0f,-60f,0f,0f,0f,1f,0f)))
        p.colorFilter = ColorMatrixColorFilter(cm)
        Canvas(out).drawBitmap(src, 0f, 0f, p)
        return out
    }
}
KOTLIN

          # ── Register plugin in MainActivity.kt ───────────────────────
          MAIN="$DIR/MainActivity.kt"
          if [ -f "$MAIN" ]; then
            sed -i 's/class MainActivity : BridgeActivity()/class MainActivity : BridgeActivity()/' "$MAIN"
            sed -i '/class MainActivity/a\    override fun onCreate(savedInstanceState: android.os.Bundle?) {\n        registerPlugin(OcrPlugin::class.java)\n        super.onCreate(savedInstanceState)\n    }' "$MAIN"
          else
            cat > "$MAIN" << 'MAIN_KT'
package com.smartstudy.admin
import android.os.Bundle
import com.getcapacitor.BridgeActivity
class MainActivity : BridgeActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        registerPlugin(OcrPlugin::class.java)
        super.onCreate(savedInstanceState)
    }
}
MAIN_KT
          fi

          # ── ML Kit dependencies in app/build.gradle ──────────────────
          python3 - << 'PY'
import re
path = "android/app/build.gradle"
txt = open(path).read()
mlkit = """
    // MLKit OCR
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.0'
"""
if "mlkit" not in txt:
    txt = re.sub(r'(dependencies\s*\{)', r'\1' + mlkit, txt, count=1)
    open(path, "w").write(txt)
    print("MLKit deps added")
else:
    print("MLKit deps already present")
PY

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Build Android Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: hanif-alias
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAdmin-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
