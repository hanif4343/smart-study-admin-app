name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Web Build
        env:
          VITE_FB_API_KEY:      ${{ secrets.VITE_FB_API_KEY }}
          VITE_FB_AUTH_DOMAIN:  ${{ secrets.VITE_FB_AUTH_DOMAIN }}
          VITE_FB_DATABASE_URL: ${{ secrets.VITE_FB_DATABASE_URL }}
          VITE_FB_PROJECT_ID:   ${{ secrets.VITE_FB_PROJECT_ID }}
          VITE_GAS_URL:         ${{ secrets.VITE_GAS_URL }}
          VITE_IMGBB_API_KEY:   ${{ secrets.VITE_IMGBB_API_KEY }}
        run: npm run build

      - name: Initialize Capacitor
        run: npx cap init "SmartAdmin" "com.smartstudy.admin" --web-dir dist

      - name: Add Android Platform
        run: npx cap add android && npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAdmin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
