name: QBank to Quiz

on:
  schedule:
    # দিনে দুইবার: রাত ২টা আর দুপুর ২টা (বাংলাদেশ সময়, UTC+6) — UTC-তে রাত ৮টা আর সকাল ৮টা
    - cron: "0 20 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch: # GitHub-এর Actions ট্যাব থেকে "Run workflow" চেপে ম্যানুয়ালিও চালানো যাবে, ফিল্টার বসিয়েও
    inputs:
      filter_audience:
        description: "Audience Tag(s), কমা দিয়ে একাধিক দেওয়া যায় (খালি রাখলে সব)"
        required: false
        default: ""
      filter_subject:
        description: "Subject(s), কমা দিয়ে একাধিক দেওয়া যায় (খালি রাখলে সব)"
        required: false
        default: ""
      filter_subtopic:
        description: "Exam paper(s), কমা দিয়ে একাধিক দেওয়া যায় (খালি রাখলে সব)"
        required: false
        default: ""

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # সর্বোচ্চ ৬ ঘন্টার একটু কম, নিরাপদ বাফার রেখে

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run QBank → Quiz converter
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
          GAS_URL: ${{ secrets.VITE_GAS_URL }}
          GAS_SECRET: ${{ secrets.GAS_SECRET }}
          GROQ_KEYS: ${{ secrets.GROQ_KEYS }}
          MISTRAL_KEYS: ${{ secrets.MISTRAL_KEYS }}
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
          OPENROUTER_KEYS: ${{ secrets.OPENROUTER_KEYS }}
          CEREBRAS_KEYS: ${{ secrets.CEREBRAS_KEYS }}
          TOGETHER_KEYS: ${{ secrets.TOGETHER_KEYS }}
          FIREWORKS_KEYS: ${{ secrets.FIREWORKS_KEYS }}
          DEEPSEEK_KEYS: ${{ secrets.DEEPSEEK_KEYS }}
          TAXONOMY_JSON: ${{ secrets.QBANK_TAXONOMY_JSON }}
          BATCH_SIZE: "15"
          SAVE_CHUNK_SIZE: "50"
          DELAY_MS: "1200"
          MAX_RUNTIME_MIN: "330"
          FILTER_AUDIENCE: ${{ github.event.inputs.filter_audience }}
          FILTER_SUBJECT: ${{ github.event.inputs.filter_subject }}
          FILTER_SUBTOPIC: ${{ github.event.inputs.filter_subtopic }}
        run: node scripts/qbank-to-quiz.mjs
