name: Generate Explanations

on:
  # ⚠️ Auto-schedule বন্ধ করা হলো (২০২৬-০৭-২১) — প্রতি ৩ ঘণ্টায় পুরো Quiz/QBank/Study
  # node ডাউনলোড হয়ে RTDB no-cost limit শেষ করে দিচ্ছিল, এমনকি সব explanation
  # যোগ হয়ে যাওয়ার পরও। দরকার হলে নিচের workflow_dispatch দিয়ে ম্যানুয়ালি চালাও।
  # আবার schedule চালু করতে চাইলে নিচের লাইন দুটো uncomment করো, কিন্তু
  # আগে স্ক্রিপ্ট fix করে নাও (পুরো node fetch না করে শুধু missing-explanation
  # রেকর্ড টার্গেট করে আনা উচিত)।
  # schedule:
  #   - cron: "0 */3 * * *"
  workflow_dispatch: # GitHub-এর Actions ট্যাব থেকে "Run workflow" চেপে ম্যানুয়ালি চালানোও যাবে, ফিল্টার বসিয়েও চালানো যাবে
    inputs:
      filter_audience:
        description: "Audience Tag(s), কমা দিয়ে একাধিক দেওয়া যায় (খালি রাখলে সব)"
        required: false
        default: ""
      filter_subject:
        description: "Subject(s), কমা দিয়ে একাধিক দেওয়া যায় (খালি রাখলে সব)"
        required: false
        default: ""
      filter_subtopic:
        description: "Sub-topic(s), কমা দিয়ে একাধিক দেওয়া যায় (খালি রাখলে সব)"
        required: false
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # সর্বোচ্চ ৬ ঘন্টার একটু কম, নিরাপদ বাফার রেখে

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run explanation generator
        env:
          GAS_URL: ${{ secrets.VITE_GAS_URL }}
          GAS_SECRET: ${{ secrets.GAS_SECRET }}
          SHEETS: "Quiz,QBank,Study"
          GROQ_KEYS: ${{ secrets.GROQ_KEYS }}
          MISTRAL_KEYS: ${{ secrets.MISTRAL_KEYS }}
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
          OPENROUTER_KEYS: ${{ secrets.OPENROUTER_KEYS }}
          CEREBRAS_KEYS: ${{ secrets.CEREBRAS_KEYS }}
          TOGETHER_KEYS: ${{ secrets.TOGETHER_KEYS }}
          FIREWORKS_KEYS: ${{ secrets.FIREWORKS_KEYS }}
          DEEPSEEK_KEYS: ${{ secrets.DEEPSEEK_KEYS }}
          SYNC_EVERY: "300"
          DELAY_MS: "1200"
          MAX_RUNTIME_MIN: "330"
          FILTER_AUDIENCE: ${{ github.event.inputs.filter_audience }}
          FILTER_SUBJECT: ${{ github.event.inputs.filter_subject }}
          FILTER_SUBTOPIC: ${{ github.event.inputs.filter_subtopic }}
        run: node scripts/generate-explanations.mjs

